name: Simple CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}  # Inject secret safely

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install --upgrade --force-reinstall langchain==0.0.227 langchain-groq \
                    python-dotenv tree-sitter tree-sitter-python tree-sitter-javascript tree-sitter-typescript \
                    pydantic rich

      - name: Security Scan
        run: python ./__main__.py

      - name: Ready Message
        if: success()  # Only runs if Security Scan passed
        run: echo "All checks passed — Ready to be deployed"
