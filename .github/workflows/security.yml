name: Simple CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install tools
        run: pip install black bandit pytest

      - name: Format with Black
        run: black .

      - name: Run Tests
        run: pytest

      - name: Ready Message
        run: echo "All checks passed — Ready to be deployed"
